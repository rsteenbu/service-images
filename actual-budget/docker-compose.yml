version: '3.8'

services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    network_mode: host
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "udp://n100d:514"
        tag: "actual-budget"
    environment:
      ACTUAL_PORT: "5006"
      ACTUAL_TRUSTED_PROXIES: "127.0.0.1,::1"
    volumes:
      - /ext/actualbudget:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
